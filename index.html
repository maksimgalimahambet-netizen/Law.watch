const LI={kk:0,ru:1,en:2};const ROUTES=["home","laws","assist","rem","saved"],ICO={home:"⌂",laws:"▤",assist:"◇",rem:"▣",saved:"♡"};
let S={lang:"kk",fav:[],rem:[],q:"",cat:"all",res:null};
try{Object.assign(S,JSON.parse(localStorage.getItem("lw3")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("lw3",JSON.stringify({lang:S.lang,fav:S.fav,rem:S.rem}))}catch(e){}};
const t=k=>T[S.lang][k],$=id=>document.getElementById(id);
const nm=l=>S.lang==="en"?EN[l.slug]:l[S.lang],cat=c=>CAT[c]?CAT[c][LI[S.lang]]:c;
const url=l=>"https://adilet.zan.kz/"+(S.lang==="ru"?"rus":"kaz")+"/docs/"+l.id;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hay=l=>[l.kk,l.ru,EN[l.slug],l.category,cat(l.category),l.id,...l.tags].join(" ").toLowerCase();
function row(l){const f=S.fav.includes(l.slug);return `<div class="row rise"><div class="di">▤</div><div class="tx"><strong>${esc(nm(l))}</strong><small>${esc(cat(l.category))} · ${l.id}</small></div><div class="acts"><a class="sm" href="${url(l)}" target="_blank" rel="noopener noreferrer">${t("off")}</a><button class="sm ${f?"on":""}" data-fav="${l.slug}"><span>${f?"♥":"♡"}</span></button></div></div>`}
function filt(){const q=S.q.trim().toLowerCase();return LAWS.filter(l=>(S.cat==="all"||l.category===S.cat)&&(!q||hay(l).includes(q)))}
const ph=(h,p)=>`<div class="ph"><h1>${h}</h1><p>${p}</p></div>`;
const PAGES={
home(){const pop=["labour","consumer","family","tax"].map(s=>LAWS.find(l=>l.slug===s));
return `<section class="hero"><div class="orb"><b>⚖</b></div><div class="eb">LEGAL INTELLIGENCE · KZ</div><h1>${t("h1")} <em>${t("h1b")}</em></h1><p>${t("hp")}</p><form class="sb" id="hs"><input id="hq" placeholder="${t("ph")}" autocomplete="off"><button class="btn">${t("go")}</button></form><div class="chips"><span class="eb" style="align-self:center">${t("pop")}</span>${pop.map(l=>`<button class="chip" data-q="${esc(nm(l))}">${esc(nm(l).split("(")[0])}</button>`).join("")}</div></section>
<div class="mq"><div>${[...LAWS,...LAWS].map(l=>`<span>${esc(nm(l))}</span>`).join("")}</div></div><div class="stats"><div class="card stat rise" style="--i:3"><b data-c="${LAWS.length}">0</b><span>${t("s1")}</span></div><div class="card stat rise" style="--i:4"><b data-c="${Object.keys(CAT).length}">0</b><span>${t("s2")}</span></div><div class="card stat rise" style="--i:5"><b data-c="3">0</b><span>${t("s3")}</span></div></div>
<h2 class="t">${t("laws")} · ${t("assist")} · ${t("rem")}</h2><div class="tools">${["laws","assist","rem","saved"].map((r,i)=>`<a href="#${r}" class="card h tool rise" style="--i:${i+4}"><div class="ic">${ICO[r]}</div><strong>${t(r)}</strong><small>${t("d"+(i+1))}</small></a>`).join("")}</div><div class="note">${t("disc")}</div>`},
laws(){return `${ph(t("laws"),t("sub"))}<input class="in" id="lq" placeholder="${t("ph")}" value="${esc(S.q)}" autocomplete="off"><div class="chips" id="cf"></div><div id="lr"></div>`},
assist(){const r=S.res;return `${ph(t("assist"),t("ap"))}<div class="card"><textarea class="in" id="pb" placeholder="${t("apph")}"></textarea><button class="btn" id="ab" style="margin-top:12px">${t("find")}</button></div>${r?`<div class="res rise"><div class="eb" style="color:var(--b7)">${t("likely").toUpperCase()}</div><h2 style="margin:6px 0 4px">${r[2][LI[S.lang]]}</h2>${r[1].map(s=>row(LAWS.find(l=>l.slug===s))).join("")}</div>`:""}`},
rem(){return `${ph(t("rem"),t("rs"))}<form class="card fm" id="rf"><label>${t("rt")}<input class="in" id="rtt" required placeholder="${t("ex")}"></label><label>${t("rd")}<input class="in" id="rdd" type="date" required></label><label>${t("rtm")}<input class="in" id="rtm" type="time" value="09:00" required></label><button class="btn">${t("add")}</button></form>
${S.rem.length?`<div style="margin-top:12px;text-align:right"><button class="sm" id="xa">${t("exp")}</button></div>`:""}${S.rem.length?S.rem.map(r=>`<div class="row rise"><div class="di">▣</div><div class="tx"><strong>${esc(r.title)}</strong><small>${r.date} · ${r.time}</small></div><div class="acts"><button class="sm" data-ics="${r.id}">${t("ics")}</button><button class="sm" data-del="${r.id}">${t("del")}</button></div></div>`).join(""):`<div class="emp"><b>▣</b>${t("norem")}</div>`}`},
saved(){const f=S.fav.map(s=>LAWS.find(l=>l.slug===s)).filter(Boolean);return `${ph(t("saved"),t("sub"))}${f.length?f.map(row).join(""):`<div class="emp"><b>♡</b>${t("nofav")}</div>`}`}};
function stag(){[...$("v").children].forEach((c,i)=>c.style.setProperty("--i",i));document.querySelectorAll("#v .rise:not([style*='--i'])").forEach((c,i)=>c.style.setProperty("--i",i));
document.querySelectorAll("[data-c]").forEach(e=>{const n=+e.dataset.c,s=performance.now();(function f(x){const p=Math.min(1,(x-s)/1100);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
function lst(){const f=filt();$("lr").innerHTML=f.length?f.map(row).join(""):`<div class="emp"><b>⚖</b>${t("none")}</div>`;document.querySelectorAll("#lr .rise").forEach((c,i)=>c.style.setProperty("--i",Math.min(i,10)))}
function chips(){$("cf").innerHTML=[["all",t("all")],...Object.keys(CAT).map(c=>[c,cat(c)])].map(([k,n])=>`<button class="chip f ${S.cat===k?"on":""}" data-cat="${esc(k)}">${esc(n)}</button>`).join("")}
function route(){const h=location.hash.slice(1);return ROUTES.includes(h)?h:"home"}
function chrome(r){$("tabs").innerHTML=ROUTES.map(x=>`<a href="#${x}" class="${x===r?"on":""}">${t(x)}</a>`).join("");$("mob").innerHTML=ROUTES.map(x=>`<a href="#${x}" class="${x===r?"on":""}"><span>${ICO[x]}</span>${t(x)}</a>`).join("");$("ft").textContent="© "+new Date().getFullYear()+" LawWatch · "+t("disc");
document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));$("pill").style.transform=`translateX(${LI[S.lang]*100}%)`;document.documentElement.lang=S.lang}
function render(top){const r=route();$("v").innerHTML=PAGES[r]();chrome(r);if(r==="laws"){chips();lst()}stag();if(top)window.scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b;
if(b=g("[data-l]")){S.lang=b.dataset.l;save();render()}
else if(b=g("[data-fav]")){const s=b.dataset.fav;S.fav=S.fav.includes(s)?S.fav.filter(x=>x!==s):[...S.fav,s];save();if(route()==="saved")render();else document.querySelectorAll(`[data-fav="${s}"]`).forEach(x=>{const on=S.fav.includes(s);x.classList.toggle("on",on);x.innerHTML=`<span>${on?"♥":"♡"}</span>`})}
else if(b=g("[data-cat]")){S.cat=b.dataset.cat;chips();lst()}
else if(b=g("[data-q]")){S.q=b.dataset.q;S.cat="all";location.hash="laws";if(route()==="laws")render()}
else if(b=g("[data-del]")){S.rem=S.rem.filter(x=>x.id!==b.dataset.del);save();render()}
else if(b=g("[data-ics]")){ics(S.rem.filter(x=>x.id===b.dataset.ics))}
else if(g("#xa"))ics(S.rem);
else if(g("#ab")){const s=$("pb").value.trim().toLowerCase();if(s.length<8){alert(t("short"));return}const m=RULES.map(r=>({r,n:r[0].filter(w=>s.includes(w)).length})).sort((a,b)=>b.n-a.n)[0];S.res=m.n?m.r:[[],["constitution","civil-general","advocacy"],["Жалпы ақпарат","Общая информация","General information"]];render()}});
document.addEventListener("input",e=>{if(e.target.id==="lq"){S.q=e.target.value;lst()}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="hs"){S.q=$("hq").value;S.cat="all";location.hash="laws"}
if(e.target.id==="rf"){S.rem.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:$("rtt").value.trim(),date:$("rdd").value,time:$("rtm").value});save();render()}});
const fmt=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
function ics(items){if(!items.length)return;const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LawWatch//EN"];items.forEach(r=>{const a=new Date(r.date+"T"+r.time+":00");if(isNaN(a))return;L.push("BEGIN:VEVENT","UID:"+r.id+"@lawwatch","DTSTAMP:"+fmt(new Date()),"DTSTART:"+fmt(a),"DTEND:"+fmt(new Date(a.getTime()+1800000)),"SUMMARY:"+r.title.replace(/[\\,;]/g,"\\$&"),"BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:LawWatch","END:VALARM","END:VEVENT")});L.push("END:VCALENDAR");const u=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"})),a=document.createElement("a");a.href=u;a.download="LawWatch.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
document.addEventListener("pointermove",e=>{const c=e.target.closest(".card,.row");if(!c)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty("--mx",x+"px");c.style.setProperty("--my",y+"px");if(c.classList.contains("tool"))c.style.transform=`perspective(700px) rotateX(${(.5-y/r.height)*10}deg) rotateY(${(x/r.width-.5)*10}deg) translateY(-5px)`});
document.addEventListener("pointerout",e=>{const c=e.target.closest(".tool");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.sm,.chip");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");s.className="rp";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)});
addEventListener("scroll",()=>{const h=document.documentElement;$("pg").style.width=(h.scrollTop/((h.scrollHeight-h.clientHeight)||1)*100)+"%"},{passive:true});
window.addEventListener("hashchange",()=>render(true));render();
